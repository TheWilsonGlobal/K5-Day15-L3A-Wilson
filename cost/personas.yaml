    input: 0.30
    output: 2.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · BTC tra 25/11/2026 (further-reading/model-prices.md)"
  - model: gemini-3.8-flash
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · BTC tra 25/11/2026 (further-reading/model-prices.md) · giá từ 01/01/2027"

