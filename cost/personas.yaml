# Mô phỏng chi phí khi dùng thật (guide bước 4.2).
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Số lần dùng và số người dùng hiện là TỰ ƯỚC TÍNH. Khi có phỏng vấn: thay uses_per_month theo câu
# "mấy lần trong 1 tháng qua" (python evidence/count.py), sửa source, rồi mới chạy lượt mô phỏng chính thức.

sessions: 50
seed: 42

users:
  low: 3000
  base: 30000
  high: 300000
  source: "Mốc: MoMo phục vụ hơn 30 triệu người dùng (Báo Đại biểu Nhân dân, 28/11/2025, xem 27/11/2026: https://daibieunhandan.vn/momo-ky-niem-15-nam-nguoi-khong-lo-fintech-viet-nam-dat-30-trieu-nguoi-dung-cong-nghe-ai-lam-chu-loi-van-hanh-10397472.html). Tỉ lệ dùng tính năng 0,01% / 0,1% / 1% là (tự ước tính)"

personas:
  - name: xem_cuoi_thang
    share: 0.5
    uses_per_month: 2
    turns_per_session: 1
    source: "(tự ước tính) · chờ số từ phỏng vấn"
    inputs:
      - "Tháng này mình tiêu tổng cộng bao nhiêu?"
      - "Tháng trước tiền của mình đi đâu nhiều nhất?"
      - "Cuối tháng rồi, cho mình bảng chi theo nhóm"

  - name: theo_doi_hang_tuan
    share: 0.35
    uses_per_month: 5
    turns_per_session: 2
    source: "(tự ước tính) · chờ số từ phỏng vấn"
    inputs:
      - "Tuần này mình chi cho ăn uống hết bao nhiêu?"
      - "Tuần trước mình tiêu những gì?"
      - "Tháng này mình đổ xăng, đi xe hết bao nhiêu?"
      - "Mình mua ở shopvui tháng này hết bao nhiêu?"
      - "Liệt kê khoản chưa rõ nhóm từ đầu tháng đến nay"

  - name: so_sanh_nhieu_thang
    share: 0.15
    uses_per_month: 3
    turns_per_session: 3
    source: "(tự ước tính) · chờ số từ phỏng vấn"
    inputs:
      - "So tiền ăn uống tháng 9 với tháng 10 giúp mình"
      - "Tháng 10 so với tháng 9 thì mình chi hơn hay kém?"
      - "Từ đầu tháng 9 đến nay mình tiêu bao nhiêu, theo từng nhóm?"
      - "Chi mua sắm từ tháng 9 đến giờ là bao nhiêu?"
      - "Từ tháng 9 đến nay mình đi xe máu hết bao nhiêu tiền?"

prices:
